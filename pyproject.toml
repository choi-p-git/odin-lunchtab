[project]
name = "odin-lunchtab"
version = "0.3.0"
description = "Transfer Odin Cloud POS account balances into a Lunchtab user export"
readme = "README.md"
authors = [
    { name = "choi-p-git", email = "choi-p-git@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
odin-lunchtab = "odin_lunchtab:main"
odin-lunchtab-gui = "odin_lunchtab.gui:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
